# =========================
# Hugo site config (hugo.toml)
# =========================
baseURL = "https://ernest.sh/"
locale = "en-us"
title = "ernest.sh"
theme = "PaperMod"
enableRobotsTXT = true
relativeURLs = true
canonifyURLs = true

# Hugo >= 0.128: use pagination.pagerSize
[pagination]
  pagerSize = 10

# -------------------------
# PaperMod global parameters
# -------------------------
[params]
  # Appearance & UX
  author = "Ernesto Martinez Gomez"
  defaultTheme = "auto"                  # auto | dark | light
  showReadingTime = true
  showCodeCopyButtons = true
  showtoc = true                         # per-post ToC enabled by default
  tocopen = false                        # ToC collapsed by default
  description = "Pentesting, AppSec, and SecDevOps specialist focused on grey-box and white-box assessments, code review, exploitation, and remediation."

  # Home — Profile Mode (polished hero)
  [params.profileMode]
    enabled  = true
    title    = "Ethical Hacker | Pentesting Web & Mobile"
    subtitle = "Pentesting • AppSec • SecDevOps • SAST & DAST • CI/CD security"
    #imageUrl = "img/avatar.jpg"          # place file at: static/img/avatar.jpg
    imageUrl = "https://avatars.githubusercontent.com/u/109539998?v=4"         
    imageWidth  = 160
    imageHeight = 160

    [[params.profileMode.buttons]]
      name = "Latest posts"
      url  = "/posts/"

  

# -------------------------
# Social icons (header/footer)
# -------------------------
[[params.socialIcons]]
  name = "github"
  url  = "https://github.com/ernestomgz"

[[params.socialIcons]]
  name = "linkedin"
  url  = "https://www.linkedin.com/in/ernestomgz/"

# -------------------------
# Menus (navbar)
# -------------------------
[[menu.main]]
  name = "Posts"
  url  = "/posts/"
  weight = 10

#[[menu.main]]
#  name = "About"
#  url  = "/about/"
#  weight = 20

[[menu.main]]
  name = "GitHub"
  url  = "https://github.com/ernestomgz"
  weight = 30

[[menu.main]]
  name = "LinkedIn"
  url  = "https://www.linkedin.com/in/ernestomgz/"
  weight = 40

# -------------------------
# Taxonomies (optional)
# -------------------------
[taxonomies]
  tag = "tags"
  category = "categories"

# -------------------------
# Markup / code highlighting
# -------------------------
[markup]
  [markup.highlight]
    lineNos = true
  [markup.goldmark.renderer]
    unsafe = false                        # set to true only if you need raw HTML in posts

# -------------------------
# Minification (optional)
# -------------------------
[minify]
  minifyOutput = true

# -------------------------
# Caches
# -------------------------
[caches]
  [caches.images]
    dir = ':cacheDir/images'

# -------------------------
# Outputs (ensure RSS on home)
# -------------------------
[outputs]
  home = ["HTML", "RSS", "JSON"]         # JSON helps search features in some themes
