name: Deploy blog to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true   # bring in PaperMod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build
        run: hugo --minify

      - name: Prepare SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          printf "Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_ed25519\n" \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USER }}" "${{ secrets.VPS_PORT }}" > ~/.ssh/config

      - name: Upload and switch symlink
        shell: bash
        run: |
          rel=$(date +%Y%m%d%H%M%S)
          ssh vps "mkdir -p '${{ secrets.VPS_PATH }}/releases/${rel}'"
          rsync -az --delete public/ vps:"${{ secrets.VPS_PATH }}/releases/${rel}/"
          ssh vps "ln -sfn '${{ secrets.VPS_PATH }}/releases/${rel}' '${{ secrets.VPS_PATH }}/current'"
