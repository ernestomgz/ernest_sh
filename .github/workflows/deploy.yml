name: Build and deploy Hugo to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Hugo
      run: |
        sudo apt-get update
        sudo apt-get install -y hugo

    - name: Build site
      run: hugo --minify

    - name: Login to Azure
      uses: azure/login@v2
      with:
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

    - name: Deploy
      uses: azure/webapps-deploy@v3
      with:
        app-name: ERNEST_SH
        package: ./public
